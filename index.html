<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body {
  margin:0;
  background:black;
  color:#00ff99;
  font-family:monospace;
}

#topbar {
  padding:10px;
}

button {
  margin-right:5px;
  padding:6px;
  background:#111;
  color:#0f0;
  border:1px solid #0f0;
}

#price {
  font-size:32px;
  padding:10px;
}

#modeLabel {
  margin-left:10px;
}
</style>
</head>

<body>

<div id="topbar">
  <button onclick="setMode('match')">MATCH</button>
  <button onclick="setMode('fast')">FAST</button>
  <button onclick="setMode('auto')">AUTO</button>
  <span id="modeLabel">Mode: AUTO</span>
</div>

<div id="price">Loading...</div>

<script>

// ===== MODE =====
let mode = "auto";

// ===== PRICE =====
let price = 0;
let prices = [];

// ===== SWITCH MODE =====
function setMode(m){
  mode = m;
  document.getElementById("modeLabel").innerText =
    "Mode: " + m.toUpperCase();
}

// ===== AUTO MODE LOGIC =====
function getAutoMode(){
  if(prices.length < 10) return "match";

  let momentum = prices[prices.length-1] - prices[prices.length-6];

  // strong move → go fast
  if(Math.abs(momentum) > 10){
    return "fast";
  }

  return "match";
}

// ===== PRICE ENGINE =====
async function fetchPrice(){

try{

let res = await fetch("https://btc-server-3eh2.onrender.com/price");
let data = await res.json();

let newPrice = data.price;

// ===== PICK MODE =====
let currentMode = mode === "auto" ? getAutoMode() : mode;

// ===== MATCH MODE =====
if(currentMode === "match"){

  let diff = newPrice - price;
  let strength = Math.abs(diff) > 10 ? 0.5 : 0.25;

  price += diff * strength;

  // hard clamp
  if(Math.abs(price - newPrice) > 20){
    price = newPrice;
  }
}

// ===== FAST MODE =====
if(currentMode === "fast"){

  let momentum = prices.length > 5
    ? (prices[prices.length-1] - prices[prices.length-5])
    : 0;

  let lead = momentum * 0.6;

  let target = newPrice + lead;

  let diff = target - price;

  price += diff * 0.35;
}

// ===== SAVE =====
prices.push(price);
if(prices.length > 200) prices.shift();

// ===== DISPLAY =====
document.getElementById("price").innerText =
"$" + price.toFixed(2);

}catch(e){
console.log("server error");
}

}

// ===== LOOP =====
setInterval(fetchPrice, 120);

</script>

</body>
</html>
