<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body { margin:0; background:black; color:#00ff99; font-family:monospace; }
#top { padding:10px; }
#price { font-size:32px; }

#chart { width:100%; height:260px; }

#panel { padding:10px; }

#openTrade {
  border:1px solid #0f0;
  margin:10px;
  padding:10px;
}

table {
  width:100%;
  border-collapse:collapse;
}

td, th {
  border:1px solid #0f0;
  padding:5px;
  text-align:center;
  font-size:12px;
}
</style>
</head>

<body>

<div id="top">
<div id="price">Connecting...</div>
</div>

<canvas id="chart"></canvas>

<div id="panel">
Signal: <span id="signal">WAIT</span> |
Confidence: <span id="conf">0%</span> |
Winrate: <span id="wr">0%</span> |
Balance: $<span id="bal">1000</span>
</div>

<div id="openTrade">
<b>Open Position</b><br>
Type: <span id="oType">NONE</span><br>
Entry: <span id="oEntry">-</span><br>
PnL: <span id="oPnl">-</span><br>
Time: <span id="oTime">0s</span>
</div>

<table>
<thead>
<tr>
<th>Type</th><th>Entry</th><th>Exit</th><th>PnL</th><th>Conf</th>
</tr>
</thead>
<tbody id="tradeTable"></tbody>
</table>

<script>

// ===== SETTINGS =====
let balance = 1000;
let TP = 0.002;
let SL = 0.001;

// ===== CONTROL =====
let activeTrade = null;
let lastSignalTime = 0;

// ===== PRICE =====
let price=0,ticker=0,agg=0,coinbase=0,prices=[];

// ===== DATA =====
let trades=[];

// ===== FEEDS =====
new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@ticker")
.onmessage=e=>ticker=parseFloat(JSON.parse(e.data).c)||ticker;

new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@aggTrade")
.onmessage=e=>{
let p=parseFloat(JSON.parse(e.data).p);
if(!isNaN(p)) agg=p-ticker;
};

const wsCB=new WebSocket("wss://ws-feed.exchange.coinbase.com");
wsCB.onopen=()=>wsCB.send(JSON.stringify({
type:"subscribe",product_ids:["BTC-USD"],channels:["ticker"]
}));
wsCB.onmessage=e=>{
let d=JSON.parse(e.data);
if(d.type==="ticker") coinbase=parseFloat(d.price)||coinbase;
};

// ===== PRICE ENGINE (SMOOTH + ACCURATE) =====
function updatePrice(){

if(!coinbase && !ticker) return;

let base=coinbase||ticker;
let target=base+(agg*0.06);

// smoother (less jitter)
price+=(target-price)*0.15;

prices.push(price);
if(prices.length>200) prices.shift();

document.getElementById("price").innerText="$"+price.toFixed(2);

draw();
updateOpen();
checkSignal();
}

// ===== CHART =====
const ctx=document.getElementById("chart").getContext("2d");

function draw(){
ctx.clearRect(0,0,window.innerWidth,260);
if(prices.length<5) return;

let max=Math.max(...prices),min=Math.min(...prices);

for(let i=1;i<prices.length;i++){
let x=i*(window.innerWidth/prices.length);
let y1=260-(prices[i-1]-min)/(max-min)*260;
let y2=260-(prices[i]-min)/(max-min)*260;

ctx.beginPath();
ctx.moveTo(x,y1);
ctx.lineTo(x,y2);
ctx.strokeStyle=prices[i]>prices[i-1]?"#0f0":"#f00";
ctx.stroke();
}
}

// ===== SMART FILTERS =====
function noTradeZone(){
let move=Math.abs(prices.at(-1)-prices.at(-5));
return move>50; // too fast = skip
}

function acceleration(){
let a=prices.at(-1),b=prices.at(-3),c=prices.at(-6);
return Math.abs((a-b)-(b-c));
}

function fakeBreak(){
let high=Math.max(...prices.slice(-10));
let low=Math.min(...prices.slice(-10));
let last=prices.at(-1);

if(last>high && prices.at(-2)<high) return true;
if(last<low && prices.at(-2)>low) return true;
return false;
}

// ===== SIGNAL =====
function checkSignal(){

if(prices.length<30 || activeTrade) return;

// spacing (~5 min)
if(Date.now()-lastSignalTime < 300000) return;

if(noTradeZone()) return;

let last=prices.at(-1);
let prev=prices.at(-10);

let move=(last-prev)/prev;
let acc=acceleration();

let conf=(Math.abs(move)*15000)+(acc*900);

// only VERY high confidence
if(conf<90) return;

// avoid fake moves
if(fakeBreak()) return;

let signal="WAIT";
if(move>0) signal="BUY";
if(move<0) signal="SELL";

document.getElementById("signal").innerText=signal;
document.getElementById("conf").innerText=conf.toFixed(0)+"%";

if(signal==="WAIT") return;

lastSignalTime=Date.now();

// delay entry 1s
setTimeout(()=>{
if(!activeTrade){
startTrade(signal,last,conf);
}
},1000);
}

// ===== TRADE =====
function startTrade(type,entry,conf){

activeTrade={type,entry,conf,start:Date.now()};
}

// ===== UPDATE OPEN =====
function updateOpen(){

if(!activeTrade) return;

let t=(Date.now()-activeTrade.start)/1000;
let move=(price-activeTrade.entry)/activeTrade.entry;
if(activeTrade.type==="SELL") move*=-1;

let pnl=move*1000;

document.getElementById("oType").innerText=activeTrade.type;
document.getElementById("oEntry").innerText=activeTrade.entry.toFixed(2);
document.getElementById("oPnl").innerText=pnl.toFixed(2);
document.getElementById("oTime").innerText=t.toFixed(1)+"s";

// min 10s hold
if(t<10) return;

if(move>=TP || move<=-SL){
finish(price);
}
}

// ===== FINISH =====
function finish(exit){

let move=(exit-activeTrade.entry)/activeTrade.entry;
if(activeTrade.type==="SELL") move*=-1;

let pnl=move*1000;
balance+=pnl;

trades.unshift({
type:activeTrade.type,
entry:activeTrade.entry,
exit,
pnl,
conf:activeTrade.conf
});

activeTrade=null;

updateTable();
updateStats();
}

// ===== TABLE =====
function updateTable(){

let html="";
trades.slice(0,20).forEach(t=>{
html+=`<tr>
<td>${t.type}</td>
<td>${t.entry.toFixed(2)}</td>
<td>${t.exit.toFixed(2)}</td>
<td>${t.pnl.toFixed(2)}</td>
<td>${t.conf.toFixed(0)}%</td>
</tr>`;
});

document.getElementById("tradeTable").innerHTML=html;
}

// ===== STATS =====
function updateStats(){
let wins=trades.filter(t=>t.pnl>0).length;
let total=trades.length;

document.getElementById("wr").innerText=
total?(wins/total*100).toFixed(1)+"%":"0%";

document.getElementById("bal").innerText=balance.toFixed(2);
}

// ===== LOOP =====
setInterval(updatePrice,50);

</script>

</body>
</html>
