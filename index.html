<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body {background:black;color:#00ff99;font-family:monospace;margin:0;}
#price {font-size:38px;padding:15px;}
#status {padding:10px;font-size:14px;}
table {width:100%;font-size:12px;}
td {padding:4px;border-bottom:1px solid #222;}
</style>
</head>

<body>

<div id="price">Connecting...</div>
<div id="status">WAITING</div>
<table id="trades"></table>

<script>

const API = "https://btc-server-3eh2.onrender.com/price";

let price = 0;
let prices = [];

let active = null;
let trades = [];
let wins = 0;
let total = 0;

let nextTrade = Date.now();

// ===== FETCH =====
async function get(){

try{

let r = await fetch(API);
let d = await r.json();

let p = d.price;

// smooth UI
price += (p - price) * 0.45;

prices.push(price);
if(prices.length > 200) prices.shift();

document.getElementById("price").innerText =
"$" + price.toFixed(2);

signals();

}catch{
document.getElementById("price").innerText = "Reconnecting...";
}

}

// ===== ELITE SIGNAL ENGINE =====
function signals(){

if(prices.length < 30) return;

let f = prices.at(-1) - prices.at(-3);
let m = prices.at(-1) - prices.at(-8);
let s = prices.at(-1) - prices.at(-20);

// volatility filter
if(Math.abs(prices.at(-1)-prices.at(-2)) > 10){
  set("NO TRADE");
  return;
}

// confidence
let c = 0;

if(Math.sign(f) === Math.sign(m)) c+=30;
if(Math.sign(m) === Math.sign(s)) c+=30;
if(Math.abs(f)>2) c+=20;
if(Math.abs(m)>4) c+=20;

// ===== ACTIVE =====
if(active){

let t = (Date.now()-active.time)/1000;

if(t < 10){
  set("HOLD " + active.side);
  return;
}

let rev = prices.at(-1) - prices.at(-5);

let exit =
  (active.side==="BUY" && rev<-2) ||
  (active.side==="SELL" && rev>2) ||
  t > 20;

if(!exit) return;

// close
let pnl = price - active.entry;
if(active.side==="SELL") pnl*=-1;

total++;
if(pnl>0) wins++;

trades.unshift({
  side: active.side,
  entry: active.entry,
  exit: price,
  pnl: pnl.toFixed(2),
  conf: active.conf
});

active=null;

set("CLOSED | WR " + Math.round((wins/total)*100)+"%");
render();

nextTrade = Date.now() + 8000 + Math.random()*10000;

return;
}

// ===== WAIT =====
if(Date.now() < nextTrade){
  set("WAIT");
  return;
}

// ===== PRE =====
if(c>=75 && c<90){
  set("PRE " + c + "%");
  return;
}

// ===== ENTER =====
if(c>=90){

let side = f>0 ? "BUY" : "SELL";

active = {
  side,
  entry: price,
  time: Date.now(),
  conf: c
};

set("ENTER " + side + " " + c + "%");

}

}

// ===== UI =====
function set(t){
  document.getElementById("status").innerText = t;
}

function render(){

let h="<tr><td>Side</td><td>Entry</td><td>Exit</td><td>PnL</td><td>Conf</td></tr>";

trades.slice(0,10).forEach(x=>{
h+=`<tr>
<td>${x.side}</td>
<td>${x.entry.toFixed(2)}</td>
<td>${x.exit.toFixed(2)}</td>
<td>${x.pnl}</td>
<td>${x.conf}%</td>
</tr>`;
});

document.getElementById("trades").innerHTML = h;

}

// ===== LOOP =====
setInterval(get, 120);

</script>

</body>
</html>
