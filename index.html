<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body {
  background:black;
  color:#00ff99;
  font-family:monospace;
  text-align:center;
}

#price {
  font-size:42px;
  margin-top:15px;
}

#status {
  font-size:18px;
  margin:10px;
}

#stats {
  font-size:14px;
  margin:5px;
}

button {
  padding:10px;
  margin:5px;
}

table {
  width:100%;
  font-size:12px;
  margin-top:10px;
}

td {
  border-bottom:1px solid #222;
  padding:4px;
}
</style>
</head>

<body>

<div id="price">Loading...</div>
<div id="status">WAITING</div>
<div id="stats">WR: 0% | Trades: 0</div>

<button onclick="togglePredict()">Prediction: OFF</button>

<table id="trades"></table>

<script>

const SERVER = "https://btc-server-3eh2.onrender.com/price";

// ===== DISPLAY =====
let display = 0;
let history = [];
let predict = false;

// ===== TRADING =====
let activeTrade = null;
let pendingEntry = null;

let trades = [];
let wins = 0;
let total = 0;

let nextSignalTime = Date.now();

// ===== TOGGLE =====
function togglePredict(){
  predict = !predict;
  document.querySelector("button").innerText =
    "Prediction: " + (predict ? "ON" : "OFF");
}

// ===== FETCH PRICE =====
async function fetchPrice(){

try{

let res = await fetch(SERVER);
let data = await res.json();

let price = data.price;

// ===== STORE HISTORY =====
history.push(price);
if(history.length > 60) history.shift();

// ===== MOMENTUM =====
let fast = history.at(-1) - history.at(-3) || 0;
let mid  = history.at(-1) - history.at(-10) || 0;
let slow = history.at(-1) - history.at(-25) || 0;

// ===== VOLATILITY =====
let vol = Math.abs(history.at(-1) - history.at(-6));

// ===== PREDICTION =====
let target = price;

if(predict && Math.abs(fast) > 3){
  target = price + fast * 0.3;
}

// ===== SMOOTH DISPLAY =====
display += (target - display) * 0.35;

document.getElementById("price").innerText =
"$" + display.toFixed(2);

// ===== SIGNAL ENGINE =====
runSignals(price, fast, mid, slow, vol);

}catch(e){
document.getElementById("price").innerText = "Reconnecting...";
}

}

// ===== SIGNAL LOGIC =====
function runSignals(price, fast, mid, slow, vol){

if(history.length < 30) return;

// ===== VOL FILTER =====
if(vol > 25){
  setStatus("NO TRADE");
  return;
}

// ===== TREND =====
let up = fast > 0 && mid > 0 && slow > 0;
let down = fast < 0 && mid < 0 && slow < 0;

// ===== TRAP DETECTION =====
let spike = history.at(-1) - history.at(-2);
let reverse = history.at(-1) - history.at(-5);

let trap =
  Math.abs(spike) > 8 &&
  Math.sign(spike) !== Math.sign(reverse);

// ===== CONFIDENCE =====
let conf = 0;

if(up || down) conf += 40;
if(Math.abs(fast) > 2) conf += 15;
if(Math.abs(mid) > 5) conf += 15;
if(!trap) conf += 15;
if(vol < 12) conf += 15;

// ===== HANDLE ENTRY DELAY =====
if(pendingEntry && !activeTrade){

if(Date.now() >= pendingEntry.time){

activeTrade = {
  side: pendingEntry.side,
  entry: price,
  start: Date.now(),
  conf: pendingEntry.conf
};

pendingEntry = null;

setStatus("ENTER " + activeTrade.side);

}

return;
}

// ===== ACTIVE TRADE =====
if(activeTrade){

let held = (Date.now() - activeTrade.start)/1000;

// HOLD MIN
if(held < 10){
  setStatus("HOLD " + activeTrade.side + " (" + held.toFixed(1)+"s)");
  return;
}

// EXIT
let exit =
  (activeTrade.side === "BUY" && fast < -2) ||
  (activeTrade.side === "SELL" && fast > 2) ||
  held > 15;

if(exit){

let pnl = price - activeTrade.entry;
if(activeTrade.side === "SELL") pnl *= -1;

total++;
if(pnl > 0) wins++;

trades.unshift({
  side: activeTrade.side,
  entry: activeTrade.entry,
  exit: price,
  pnl: pnl.toFixed(2),
  conf: activeTrade.conf
});

activeTrade = null;

updateStats();
renderTrades();

setStatus("CLOSED");

// spacing between trades
nextSignalTime = Date.now() + 60000;

}

return;
}

// ===== WAIT =====
if(Date.now() < nextSignalTime){
  setStatus("WAIT");
  return;
}

// ===== PRE =====
if(conf >= 75 && conf < 95){
  setStatus("PRE " + conf + "%");
  return;
}

// ===== ENTER =====
if(conf >= 95){

let side = up ? "BUY" : "SELL";

setStatus("WAIT ENTRY");

// 1 second real entry delay
pendingEntry = {
  side,
  conf,
  time: Date.now() + 1000
};

}

}

// ===== UI =====
function setStatus(t){
  document.getElementById("status").innerText = t;
}

function updateStats(){
  let wr = total ? Math.round((wins/total)*100) : 0;
  document.getElementById("stats").innerText =
    "WR: " + wr + "% | Trades: " + total;
}

function renderTrades(){

let html = "<tr><td>Side</td><td>Entry</td><td>Exit</td><td>PnL</td><td>Conf</td></tr>";

trades.slice(0,10).forEach(t=>{
html += `<tr>
<td>${t.side}</td>
<td>${t.entry.toFixed(2)}</td>
<td>${t.exit.toFixed(2)}</td>
<td>${t.pnl}</td>
<td>${t.conf}%</td>
</tr>`;
});

document.getElementById("trades").innerHTML = html;
}

// ===== LOOP =====
setInterval(fetchPrice, 120);

</script>

</body>
</html>
