<!DOCTYPE html>
<html>
<body style="background:black;color:lime;text-align:center;font-family:monospace;">

<h1 id="price">Loading...</h1>

<script>

const API = "https://https://btc-server-3eh2.onrender.com"; // CHANGE THIS

async function getPrice(){
  try{
    let res = await fetch(API);
    let data = await res.json();
    document.getElementById("price").innerText = "$" + data.price;
  } catch(e){
    document.getElementById("price").innerText = "Connecting...";
  }
}

setInterval(getPrice, 1000);

</script>

</body>
</html>
