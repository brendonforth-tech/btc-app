<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
body { margin:0; background:black; color:#00ff99; font-family:monospace; }
#top { display:flex; justify-content:space-between; padding:10px; }
#price { font-size:28px; }
button { margin-left:5px; }
#chart { width:100%; height:260px; }
#panel { padding:10px; }
#trades { max-height:160px; overflow:auto; border-top:1px solid #0f0; }
</style>
</head>

<body>

<div id="top">
  <div id="price">Connecting...</div>
  <div>
    <button onclick="auto=!auto">Auto</button>
    <button onclick="sessionFilter=!sessionFilter">Session</button>
  </div>
</div>

<canvas id="chart"></canvas>

<div id="panel">
Signal: <span id="signal">WAIT</span><br>
Confidence: <span id="conf">0%</span><br>
Winrate: <span id="wr">0%</span><br>
Balance: $<span id="bal">1000</span><br>
Best Tier: <span id="bestTier">--</span><br>
Best Time: <span id="bestTime">--</span>
</div>

<div id="panel">
80: <span id="t80">0%</span> |
85: <span id="t85">0%</span> |
90: <span id="t90">0%</span> |
95: <span id="t95">0%</span> |
100: <span id="t100">0%</span>
</div>

<div id="trades"></div>

<script>

// ===== SETTINGS =====
let auto = true;
let sessionFilter = true;
let balance = 1000;

// TP / SL
let TP = 0.002;
let SL = 0.001;

// ===== PRICE DATA =====
let price = 0;
let aggPrice = 0;
let tickerPrice = 0;
let prices = [];
let trades = [];

// ===== STATS =====
let tiers = {80:{w:0,l:0},85:{w:0,l:0},90:{w:0,l:0},95:{w:0,l:0},100:{w:0,l:0}};
let hours = {};

// ===== SESSION FILTER =====
function goodSession(){
if(!sessionFilter) return true;
let h=new Date().getHours();
return (h>=8&&h<=11)||(h>=2&&h<=5);
}

// ===== CHART =====
const ctx = document.getElementById("chart").getContext("2d");

function draw(){
ctx.clearRect(0,0,window.innerWidth,260);
if(prices.length<5) return;

let max=Math.max(...prices);
let min=Math.min(...prices);

for(let i=1;i<prices.length;i++){
let x=i*(window.innerWidth/prices.length);
let y1=260-(prices[i-1]-min)/(max-min)*260;
let y2=260-(prices[i]-min)/(max-min)*260;

ctx.beginPath();
ctx.moveTo(x,y1);
ctx.lineTo(x,y2);
ctx.strokeStyle=prices[i]>prices[i-1]?"#0f0":"#f00";
ctx.stroke();
}
}

// ===== FEEDS =====
const ws1 = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@aggTrade");
ws1.onmessage = e=>{
let d=JSON.parse(e.data);
let p=parseFloat(d.p);
if(!isNaN(p)) aggPrice=p;
};

const ws2 = new WebSocket("wss://stream.binance.com:9443/ws/btcusdt@ticker");
ws2.onmessage = e=>{
let d=JSON.parse(e.data);
let p=parseFloat(d.c);
if(!isNaN(p)) tickerPrice=p;
};

// ===== PRICE ENGINE =====
function getPrice(){
if(!aggPrice && !tickerPrice) return;
let blended=(aggPrice*0.65)+(tickerPrice*0.35);
price += (blended - price) * 0.4;
return price;
}

// ===== CONFIDENCE =====
function confidence(move,vol){
return Math.min(100,(Math.abs(move)*12000)+(vol*400));
}

// ===== SIGNAL =====
function checkSignal(){

if(prices.length<30 || !goodSession()) return;

let last=prices.at(-1);
let prev=prices.at(-10);

let move=(last-prev)/prev;
let vol=Math.abs(prices.at(-1)-prices.at(-2));

let conf=confidence(move,vol);
document.getElementById("conf").innerText=conf.toFixed(0)+"%";

let signal="WAIT";
if(move>0.0008) signal="BUY";
if(move<-0.0008) signal="SELL";

document.getElementById("signal").innerText=signal;

// BEST TIER FILTER
let tier=Math.floor(conf/5)*5;
let best=document.getElementById("bestTier").innerText.replace("%","");

if(best!=="--" && tier!=best) return;

if(signal!=="WAIT"){
startTrade(signal,last,conf);
}
}

// ===== TRADE =====
function startTrade(type,entry,conf){

let interval=setInterval(()=>{

let move=(price-entry)/entry;
if(type==="SELL") move*=-1;

// TP / SL
if(move>=TP || move<=-SL){
clearInterval(interval);
finishTrade(type,entry,price,conf);
}

},200);
}

// ===== FINISH =====
function finishTrade(type,entry,exit,conf){

let pnl=((exit-entry)/entry)*1000;
if(type==="SELL") pnl*=-1;

balance+=pnl;

// tier
let t=Math.floor(conf/5)*5;
if(tiers[t]){
if(pnl>0) tiers[t].w++; else tiers[t].l++;
}

// hour
let h=new Date().getHours();
if(!hours[h]) hours[h]={w:0,l:0};
if(pnl>0) hours[h].w++; else hours[h].l++;

trades.unshift(`${type} | ${conf.toFixed(0)}% | ${pnl.toFixed(2)}`);

updateStats();
}

// ===== STATS =====
function updateStats(){

let w=0,l=0,bestT="--",bestWR=0;

Object.keys(tiers).forEach(t=>{
let d=tiers[t];
let tot=d.w+d.l;
let wr=tot?d.w/tot*100:0;

document.getElementById("t"+t).innerText=wr.toFixed(0)+"%";

if(wr>bestWR){bestWR=wr;bestT=t;}
w+=d.w;l+=d.l;
});

let tot=w+l;
document.getElementById("wr").innerText=tot?(w/tot*100).toFixed(1)+"%":"0%";
document.getElementById("bal").innerText=balance.toFixed(2);
document.getElementById("bestTier").innerText=bestT+"%";

// best hour
let bh="--",bwr=0;
Object.keys(hours).forEach(h=>{
let d=hours[h];
let tot=d.w+d.l;
let wr=tot?d.w/tot*100:0;
if(wr>bwr){bwr=wr;bh=h;}
});
document.getElementById("bestTime").innerText=bh+":00";

document.getElementById("trades").innerHTML=trades.slice(0,50).join("<br>");
}

// ===== MAIN LOOP =====
setInterval(()=>{

let p=getPrice();
if(!p) return;

if(p<10000||p>200000) return;

price=p;

prices.push(price);
if(prices.length>200) prices.shift();

document.getElementById("price").innerText="$"+price.toFixed(2);

draw();
checkSignal();

},50);

</script>

</body>
</html>
